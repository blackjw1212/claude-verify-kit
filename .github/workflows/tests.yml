# 跨平台測試:Ubuntu / Windows / macOS × Python 3.8 / 3.11 / 3.12 / 3.13。
# fail-fast 關掉:一格紅了其他格照跑,才看得出是「某平台的問題」還是「全部都壞」。
# 每格都上傳 JUnit XML,被跳過的測試與原因(-rs)也印在日誌裡 —— 跳過不等於通過。
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  py38-compat:
    # hook 要能在 Python 3.8 上跑:用 vermin 靜態檢查有沒有用到 3.9+ 的語法或 API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install vermin==1.6.0
      - run: vermin -t=3.8- --no-tips --violations --eval-annotations .claude/hooks/verify.py tests bench

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: 環境紀錄
        run: |
          python -VV
          python -c "import sys, locale; print(sys.platform, 'locale=' + locale.getpreferredencoding(False), 'fs=' + sys.getfilesystemencoding(), 'stdout=' + str(sys.stdout.encoding))"
          node --version || echo "node: 未安裝"
          shellcheck --version | head -2 || echo "shellcheck: 未安裝"
      - run: python -m pip install pytest
      - name: 測試
        run: >
          python -m pytest tests -rs -p no:cacheprovider
          --junitxml "junit-${{ matrix.os }}-py${{ matrix.python }}.xml"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: junit-*.xml
          if-no-files-found: error
